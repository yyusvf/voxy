# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon = false

# Fabric properties
minecraft_version=1.21.1
loader_version=0.19.3
fabric_api_version=0.116.15+1.21.1

# Sodium: Voxy integrates with Sodium's terrain renderer directly.
# 0.8.x is the API generation upstream Voxy 0.2.9 targets, and it is what is available for
# MC 1.21.1 alongside 0.6.13.
sodium_version=mc1.21.1-0.8.12-fabric
lithium_version=mc1.21.1-0.15.1-fabric

# Iris (only used by the shader build: ./gradlew build -Pshaders)
iris_version=1.8.8+1.21.1-fabric

# Mod Properties
mod_version = 0.2.9-alpha
maven_group = me.cortex
archives_base_name = voxy

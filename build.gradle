plugins {
    id 'fabric-loom' version "1.17.19"
    id 'maven-publish'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

// Experimental shader build: ./gradlew build -Pshaders
// Produces a SEPARATE artifact (voxy-shaders-*.jar) so the known-good jar is never overwritten.
// Only one of the two may be in the mods folder at a time - both use modId "voxy".
def withShaders = project.hasProperty('shaders')

base {
    archivesName = withShaders ? "${project.archives_base_name}-shaders" : project.archives_base_name
}

// Optional integrations that are not ported to MC 1.21.1 yet.
sourceSets {
    main {
        java {
            // Iris shader integration is always compiled, but its mixins are only registered in
            // the -Pshaders build. Without those mixins IrisRenderingPipeline never implements
            // IGetIrisVoxyPipelineData, so RenderPipelineFactory falls back to the normal pipeline.

            // Sodium's config API (net.caffeinemc.mods.sodium.api.config) only exists from
            // Sodium 0.7 onwards. 0.6.13 still has the old SodiumOptionsGUI, so these stay out.
            exclude 'me/cortex/voxy/client/config/SodiumConfigBuilder.java'
            exclude 'me/cortex/voxy/client/config/VoxyConfigMenu.java'
            exclude 'me/cortex/voxy/client/config/IConfigPageSetter.java'
            exclude 'me/cortex/voxy/client/mixin/sodium/MixinVideoSettingsScreen.java'

            // ModMenu integration - no ModMenu dependency declared
            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'

            // Flashback integration mixins
            exclude 'me/cortex/voxy/client/mixin/flashback/**'

            // Nvidium integration mixins
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'

            // Debug screen integration (API changed in MC 1.21.1)
            exclude 'me/cortex/voxy/client/VoxyDebugScreenEntry.java'
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinDebugScreenEntryList.java'

            // Blaze3D OpenGL debug mixin (GlDebug class not accessible in MC 1.21.1)
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinGlDebug.java'

            // BlockableEventLoop mixin (isNonRecoverable method removed in MC 1.21.1 - Issue #2)
            exclude 'me/cortex/voxy/client/mixin/minecraft/MixinBlockableEventLoop.java'
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def version = project.version

    // The iris mixin config is only registered in the -Pshaders build; outside it the iris mixin
    // classes must never be referenced by a config, or Fabric reports phantom mixins.
    def irisMixins = withShaders ? ',\n    {\n      "config": "client.voxy.iris.mixins.json",\n      "environment": "client"\n    }' : ''

    inputs.properties("version": version, "commit": hash, "buildtime": time, "irisMixins": irisMixins)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time, "irisMixins": irisMixins
    }

    if (!withShaders) {
        exclude 'client.voxy.iris.mixins.json'
    }

    // NeoForge-only metadata
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The source tree uses Mojang official names (LevelRenderer, ClientLevel, SectionPos, ...),
    // not Yarn - it was written against official mappings during the NeoForge port.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Sodium: Voxy hooks its terrain renderer directly
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    modCompileOnly "maven.modrinth:lithium:${project.lithium_version}"

    // Iris. modCompileOnly: soft dependency, the iris mixins are disabled at runtime (and
    // unregistered outside the -Pshaders build) when Iris is absent.
    modCompileOnly "maven.modrinth:iris:${project.iris_version}"

    // === Bundled dependencies (nested jars) ===

    // LWJGL-LMDB and LWJGL-ZSTD - required by Voxy, NOT provided by Minecraft
    include(implementation("org.lwjgl:lwjgl-lmdb:3.3.3"))
    include(implementation("org.lwjgl:lwjgl-zstd:3.3.3"))
    include(runtimeOnly("org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows"))
    include(runtimeOnly("org.lwjgl:lwjgl-zstd:3.3.3:natives-windows"))
    include(runtimeOnly("org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux"))
    include(runtimeOnly("org.lwjgl:lwjgl-zstd:3.3.3:natives-linux"))

    // RocksDB - default storage backend
    include(implementation("org.rocksdb:rocksdbjni:10.2.1"))

    // LZ4 - provided by the Minecraft runtime, do not bundle
    implementation 'org.lz4:lz4-java:1.8.0'

    // Redis storage backend + connection pooling
    include(implementation("redis.clients:jedis:5.1.0"))
    include(implementation("org.apache.commons:commons-pool2:2.12.0"))

    // Distant Horizons import support
    include(implementation("org.tukaani:xz:1.10"))
    include(implementation("org.xerial:sqlite-jdbc:3.49.1.0"))
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}

// === Validation tasks (shared with the NeoForge branch) ===

task validateMixinConfig(type: Exec) {
    description = 'Validates mixin registration, exclusions, and configuration'
    group = 'verification'
    commandLine 'python3', 'scripts/validate_mixin_config.py'
    environment 'PYTHONIOENCODING', 'utf-8'
    onlyIf { file('scripts/validate_mixin_config.py').exists() }
}

task validatePortStubs(type: Exec) {
    description = 'Lists newly introduced constant-disabled branches (if (false) / && !false)'
    group = 'verification'
    commandLine 'python3', 'scripts/validate_port_stubs.py'
    environment 'PYTHONIOENCODING', 'utf-8'
    onlyIf { file('scripts/validate_port_stubs.py').exists() }
}

compileJava.dependsOn validatePortStubs

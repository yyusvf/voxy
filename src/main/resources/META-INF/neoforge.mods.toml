modLoader="javafml"
loaderVersion="[4,)"
license="All-Rights-Reserved"
issueTrackerURL="https://github.com/MCRcortex/voxy/issues"

[[mods]]
modId="voxy"
version="${version}"
displayName="Voxy"
description="Far distance rendering mod utilising LoDs"
authors="Cortex"
# Must be a single path segment at the JAR root: both NeoForge's mod list screen and
# Embeddium's video settings tab pass this straight to PackResources.getRootResource(),
# which rejects any value containing '/' (FileUtil.validatePath -> IllegalArgumentException).
logoFile="icon.png"

[[dependencies.voxy]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="embeddium"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

# Sodium and Embeddium are mutually exclusive; this build integrates with Embeddium only.
[[dependencies.voxy]]
modId="sodium"
type="incompatible"
reason="This build of Voxy targets Embeddium. Use the Sodium build of Voxy instead."
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.voxy]]
modId="fabric_api"
type="required"
versionRange="[0.102.0,)"
ordering="BEFORE"
side="BOTH"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="common.voxy.mixins.json"
${irisMixins}
